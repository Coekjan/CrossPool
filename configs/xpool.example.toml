[daemon]
host = "127.0.0.1"
port = 9810

[logging]
level = "info"
color = true

[scheduler]
# Reserved for future attention-side KV-pool admission.
atn_concurrency = 1
# Executor Lane count materialized for each Fabric generation.
ffn_concurrency = 1
ffn_policy = "fifo"

[vendor]
model_base_uri = "/absolute/path/to/models"

[devices]
atn_cuda_devices = [0]
ffn_cuda_devices = [1]

[[models]]
id = "deepseek-ai/DeepSeek-V2-Lite-Chat"

[[models]]
id = "Qwen/Qwen3-14B"
