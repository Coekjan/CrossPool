[build-system]
requires = [
    "cmake>=4.3.2",
    "ninja>=1.13.0",
    "scikit-build-core>=0.11",
    "torch==2.11.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "xpool"
version = "0.1.0"
description = "xpool system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cuda-python>=13.0,<14.0",
    "fastapi>=0.137.1",
    "flashinfer-cubin==0.6.12",
    "flashinfer-python[cu13]==0.6.12",
    "httpx>=0.28.1",
    "nvidia-nvshmem-cu13==3.4.5",
    "numpy>=2.3.5,<2.4",
    "pydantic>=2.13.4",
    "safetensors>=0.8.0",
    "sglang==0.5.13.post1",
    "torch==2.11.0",
    "transformers==5.8.1",
    "uvicorn>=0.49.0",
]

[project.scripts]
xpool = "xpool.cli:main"

[project.entry-points."sglang.srt.plugins"]
xpool = "xpool.integrations.sglang.plugin:install"

[dependency-groups]
dev = [
    "cmake>=4.3.2",
    "ninja>=1.13.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = true
prerelease = "if-necessary-or-explicit"
python-downloads = "automatic"
python-preference = "only-managed"
required-version = ">=0.11.19"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.26"
ninja.version = ">=1.11"
wheel.packages = ["src/xpool"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "ANN401", "D101", "D102", "D103", "D107", "D417"]

[tool.ruff.lint.per-file-ignores]
".codex/skills/**" = ["D101", "D102", "D103", "D107", "D417"]
"tests/**" = ["D101", "D102", "D103", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
