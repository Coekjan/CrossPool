[build-system]
requires = [
    "cmake==4.3.2",
    "ninja>=1.13.0",
    "pybind11-stubgen==2.5.5",
    "scikit-build-core>=0.11",
    "torch==2.13.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "xpool"
version = "0.1.0"
description = "Resource-disaggregated infrastructure for multi-model serving"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cuda-bindings>=13.0.3,<14",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "nvidia-nvshmem-cu13==3.7.2",
    "ortools==9.15.6755",
    "pydantic>=2.13.4",
    "psutil>=7.2.2",
    "safetensors>=0.8.0",
    "setproctitle>=1.3.7,<2",
    "sglang-kernel==0.4.6.post1",
    "sglang==0.5.19",
    "torch==2.13.0",
    "triton==3.7.1",
    "transformers==5.12.1",
    "uvicorn>=0.49.0",
]

[project.scripts]
xpool = "xpool.cli:main"
xtest = "xtest:main"

[project.entry-points."sglang.srt.plugins"]
xpool = "xpool.integrations.sglang.plugin:install"

[dependency-groups]
dev = [
    "clang-format==22.1.5",
    "cmake==4.3.2",
    "ninja>=1.13.0",
    "pre-commit>=4.6.0",
    "pybind11-stubgen==2.5.5",
    "pytest>=9.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.17",
    "scikit-build-core>=0.11",
    "tomli-w>=1.2.0",
    "ty>=0.0.49",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["nvidia-nvshmem-cu13==3.7.2"]
package = true
prerelease = "if-necessary-or-explicit"
python-downloads = "automatic"
python-preference = "only-managed"
required-version = ">=0.11.19"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.26"
ninja.version = ">=1.11"
wheel.packages = ["src/xpool", "src/xtest"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
timeout = 300
markers = [
    "requires_config: requires an XpoolConfig supplied by XPOOL_CONFIG",
    "requires_cuda(min_devices=1): requires visible CUDA devices",
    "requires_mps: requires a responsive CUDA MPS controller",
    "requires_model_weights(model_id): requires model weights resolved through XPOOL_CONFIG",
    "estimated_duration(seconds): estimated runtime used by xtest run scheduling",
    "serving_graph_group(name, expected_case_count): complete cross-task serving graph group",
]
testpaths = ["tests/suites"]

[tool.ty.rules]
deprecated = "error"

[tool.ruff]
line-length = 120
extend-exclude = ["src/xpool/native"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "FAST",
    "I",
    "ANN401",
    "D200",
    "D201",
    "D204",
    "D205",
    "D209",
    "D210",
    "D211",
    "D214",
    "D405",
    "D410",
    "D411",
    "D412",
    "D414",
    "D416",
    "D419",
    "RUF",
    "UP",
    "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
