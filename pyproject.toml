[project]
name = "xpool"
version = "0.1.0"
description = "xpool v3 runtime scaffold"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
runtime-cu13 = [
    "fastapi>=0.137.1",
    "flash-attn-4==4.0.0b17",
    "flashinfer-cubin==0.6.12",
    "flashinfer-python[cu13]==0.6.12",
    "httpx>=0.28.1",
    "numpy>=2.3.5,<2.4",
    "nvshmem4py-cu13>=0.3.1",
    "pydantic>=2.13.4",
    "safetensors>=0.8.0",
    "sglang==0.5.13.post1",
    "transformers==5.8.1",
    "torchvision==0.26.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "cmake>=4.3.2",
    "ninja>=1.13.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false
prerelease = "if-necessary-or-explicit"
python-downloads = "automatic"
python-preference = "only-managed"
required-version = ">=0.11.19"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
docstring-code-format = true
