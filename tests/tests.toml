[topology_cases.topology-001]
description = "Single-rank FFN delivery for complete and rank-summed outputs."
module = "e2e.sglang.test_e2e_ffn_topology"
deployment = "atn1-ffn1-lanes1"
instances = [{ model_id = "Qwen/Qwen3-0.6B", layer_ordinal = 0 }]
requests = [
  { instance_index = 0, forward_mode = "decode", dp_rank_payload_rows = [1], output_requirement = "per_rank_complete" },
  { instance_index = 0, forward_mode = "decode", dp_rank_payload_rows = [1], output_requirement = "group_sum_complete" },
  { instance_index = 0, forward_mode = "prefill", dp_rank_payload_rows = [128], output_requirement = "per_rank_complete" },
  { instance_index = 0, forward_mode = "prefill", dp_rank_payload_rows = [128], output_requirement = "group_sum_complete" },
]
estimated_duration_seconds = 600
timeout_seconds = 3600

[topology_cases.topology-002]
