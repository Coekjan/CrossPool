requests = [
  { instance_index = 0, forward_mode = "decode", dp_rank_payload_rows = [1, 0, 0, 0], output_requirement = "group_sum_complete" },
  { instance_index = 0, forward_mode = "prefill", dp_rank_payload_rows = [32, 32, 32, 32], output_requirement = "group_sum_complete" },
]
estimated_duration_seconds = 900
