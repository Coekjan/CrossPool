fail_fast: true

repos:
  - repo: local
    hooks:
      - id: native-build
        name: native build
        entry: >-
          bash -lc 'if [ -f .env ]; then
            export UV_ENV_FILE="$PWD/.env";
          fi;
          exec uv sync --group dev --reinstall-package xpool --no-build-isolation-package xpool'
        language: system
        pass_filenames: false

      - id: whitespace-check
        name: whitespace check
        entry: git diff --cached --check
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python]

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python]

      - id: clang-format
        name: clang-format
        entry: clang-format --dry-run --Werror
        language: system
        types_or: [c, c++, cuda]

      - id: doxygen
        name: doxygen
        entry: doxygen Doxyfile
        language: system
        files: ^(Doxyfile|src/cext-include/.*\.(cuh|h|hh|hpp))$
        pass_filenames: false

      - id: ctest
        name: ctest
        entry: >-
          bash -lc 'set -- build/*/CTestTestfile.cmake;
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one CTest build dir; run native-build first" >&2;
            exit 1;
          fi;
          uv run --no-build-isolation-package xpool ctest --test-dir "$(dirname "$1")" --output-on-failure'
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: >-
          bash -lc 'if [ -f .env ]; then
            export UV_ENV_FILE="$PWD/.env";
          fi;
          exec uv run pytest'
        language: system
        pass_filenames: false
