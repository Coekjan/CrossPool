[build-system]
requires = ["scikit-build-core==1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "xpool-dev"
version = "0.1.0"
description = "Development test tools for CrossPool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "xpool",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pytest>=9.1.0",
    "pytest-timeout>=2.4.0",
    "safetensors>=0.8.0",
    "sglang==0.5.20",
    "tomli-w>=1.2.0",
    "torch==2.13.0",
    "transformers==5.12.1",
]

[project.scripts]
xtest = "xtest.cli:main"

[tool.scikit-build]
wheel.cmake = false
wheel.packages = ["xkit", "xtest"]
